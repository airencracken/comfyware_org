name: Website checks

on:
  push:
    paths: ['site/**', 'scripts/site/**', 'Makefile', '.github/workflows/website.yml']
  pull_request:
    paths: ['site/**', 'scripts/site/**', 'Makefile', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

# Commands handle errors explicitly.
defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate routes, markup, metadata, and assets
        run: make test-content
      - name: Install Caddy for HTTP checks
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install -y caddy || exit 1
      - name: Check production HTTP behavior
        run: make test-http test-deploy check-config
      - name: Install browser test dependencies and Chromium
        run: make setup PLAYWRIGHT_INSTALL_ARGS=--with-deps
      - name: Check responsive layouts, accessibility, and navigation
        run: make test-browser
