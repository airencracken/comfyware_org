name: Website checks

on:
  push:
    paths: ['site/**', 'scripts/site/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['site/**', 'scripts/site/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate routes, markup, metadata, and assets
        run: python3 scripts/site/test_content.py
      - name: Install Caddy for HTTP checks
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install -y caddy || exit 1
      - name: Check production HTTP behavior
        run: python3 scripts/site/test_http.py
      - name: Install browser test dependencies
        working-directory: scripts/site
        run: npm ci
      - name: Install Chromium
        working-directory: scripts/site
        run: npx playwright install --with-deps chromium
      - name: Check responsive layouts, accessibility, and navigation
        working-directory: scripts/site
        run: npm test
